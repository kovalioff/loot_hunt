[project]
name = "loot-hunt"
version = "0.1.0"
description = "Telegram bot for finding and monitoring active Pepper.pl offers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.20,<4",
  "aiosqlite>=0.21,<1",
  "curl-cffi>=0.13,<1",
  "google-genai>=1.30,<2",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
loot-hunt = "loot_hunt.main:main"
loot-hunt-smoke = "loot_hunt.smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loot_hunt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
